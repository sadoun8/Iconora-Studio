name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Ensure assets directory exists
      run: |
        if (-Not (Test-Path assets)) { New-Item -ItemType Directory assets | Out-Null }

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        python -m PyInstaller --onedir --windowed --name "Iconora Studio" --icon=assets/icons/app.ico --add-data "assets;assets" --add-data "ui;ui" --add-data "core;core" --collect-all customtkinter --collect-all PIL --hidden-import customtkinter --hidden-import pillow --hidden-import tkinterdnd2 --hidden-import cairosvg --clean --noconfirm main.py

    - name: List dist
      run: dir dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Iconora-Studio-windows-exe
        path: dist/
